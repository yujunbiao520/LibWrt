name: Build OpenWrt

on:
  workflow_dispatch:

  jobs:
    build:
        runs-on: ubuntu-22.04
            timeout-minutes: 720

                    steps:
                          - name: Checkout
                                  uses: actions/checkout@v4
                                          with:
                                                    fetch-depth: 0
                                                              submodules: recursive

                                                                    - name: Install packages
                                                                            run: |
                                                                                      sudo apt update
                                                                                                sudo apt install -y build-essential clang flex bison g++ gawk \
                                                                                                            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
                                                                                                                        python3-distutils rsync unzip zlib1g-dev file wget python3-ply \
                                                                                                                                    qemu-utils
                                                                                                                                    
                                                                                                                                          - name: Copy config
                                                                                                                                                  run: |
                                                                                                                                                            cp .config ./defconfig
                                                                                                                                                            
                                                                                                                                                                  - name: Update feeds
                                                                                                                                                                          run: |
                                                                                                                                                                                    ./scripts/feeds update -a
                                                                                                                                                                                              ./scripts/feeds install -a
                                                                                                                                                                                              
                                                                                                                                                                                                    - name: Configure
                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                      cp defconfig .config
                                                                                                                                                                                                                                make defconfig
                                                                                                                                                                                                                                
                                                                                                                                                                                                                                      - name: Download
                                                                                                                                                                                                                                              run: make download -j8
                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                    - name: Build
                                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                                      make -j$(nproc) || make -j1 V=s
                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                            - name: Upload firmware
                                                                                                                                                                                                                                                                                    uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                                      name: openwrt-firmware
                                                                                                                                                                                                                                                                                                                path: bin/targets/qualcommax/ipq807x/*.bin
                                                                                                                                                                                                                                                                                                                
